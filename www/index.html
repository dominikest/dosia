<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f8a70">
<title>Dosia – Medikamente</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f4; --text:#15202b;
    --muted:#5c6b7a; --line:#e2e7ec; --brand:#1f8a70; --brand-ink:#0d5c49;
    --accent:#2d6cdf; --warn:#c7791a; --danger:#c23b3b; --ok:#1f8a70;
    --radius:16px; --shadow:0 2px 14px rgba(20,32,43,.08);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0f1620; --surface:#18222e; --surface-2:#1f2b38; --text:#e7edf3;
      --muted:#93a3b3; --line:#283543; --brand:#2fb094; --brand-ink:#8de6d3;
      --accent:#6ea2ff; --warn:#e0a44a; --danger:#e36a6a; --ok:#2fb094;
      --shadow:0 2px 16px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1620; --surface:#18222e; --surface-2:#1f2b38; --text:#e7edf3;
    --muted:#93a3b3; --line:#283543; --brand:#2fb094; --brand-ink:#8de6d3;
    --accent:#6ea2ff; --warn:#e0a44a; --danger:#e36a6a; --ok:#2fb094;
    --shadow:0 2px 16px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.45; padding-bottom:calc(72px + var(--safe-b));
  }
  header{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--line); padding:14px 16px calc(14px);
    display:flex; align-items:center; gap:10px;
  }
  header .logo{width:30px;height:30px;flex:0 0 auto}
  header h1{font-size:19px; margin:0; font-weight:700; letter-spacing:.2px}
  header .date{margin-left:auto; font-size:13px; color:var(--muted); text-align:right}
  main{padding:16px; max-width:720px; margin:0 auto}
  h2.section{font-size:14px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:4px 2px 10px}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-bottom:12px}
  .row{display:flex; align-items:center; gap:12px}
  .pill{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-size:20px;background:var(--surface-2)}
  .grow{flex:1 1 auto; min-width:0}
  .title{font-weight:650; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sub{font-size:13px; color:var(--muted)}
  .muted{color:var(--muted)}
  .tag{display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:var(--surface-2); color:var(--muted); margin-right:6px}
  .tag.warn{background:rgba(199,121,26,.15); color:var(--warn)}
  .tag.danger{background:rgba(194,59,59,.15); color:var(--danger)}
  .tag.ok{background:rgba(31,138,112,.15); color:var(--ok)}

  button{font:inherit; cursor:pointer; border:none; border-radius:12px; padding:10px 14px; background:var(--surface-2); color:var(--text)}
  button:active{transform:scale(.98)}
  .btn-primary{background:var(--brand); color:#fff; font-weight:650}
  .btn-ghost{background:transparent; border:1px solid var(--line)}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid var(--danger)}
  .btn-sm{padding:7px 11px; font-size:14px; border-radius:10px}
  .btn-round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;padding:0}
  .actions{display:flex; gap:8px; flex-wrap:wrap}

  .dose-item{display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--line)}
  .dose-item:first-child{border-top:none}
  .time{font-variant-numeric:tabular-nums; font-weight:700; font-size:15px; width:52px; flex:0 0 auto}
  .take{display:flex; gap:8px; flex:0 0 auto}
  .state-taken{opacity:.55}
  .state-taken .title{text-decoration:line-through}

  label{display:block; font-size:13px; color:var(--muted); margin:10px 0 4px}
  input,select,textarea{
    width:100%; font:inherit; color:var(--text); background:var(--surface-2);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px;
  }
  input[type=checkbox]{width:auto}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px}
  .pbar{margin:0 0 14px; flex-wrap:nowrap; overflow-x:auto; padding-bottom:2px; scrollbar-width:none}
  .pbar .chip{white-space:nowrap; cursor:pointer}
  .chip{padding:8px 12px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); font-size:14px; user-select:none}
  .chip.on{background:var(--brand); color:#fff; border-color:var(--brand)}

  .fab{position:fixed; right:18px; bottom:calc(86px + var(--safe-b)); z-index:30;
    width:58px;height:58px;border-radius:50%; background:var(--brand); color:#fff;
    font-size:30px; box-shadow:0 6px 20px rgba(31,138,112,.45); display:grid; place-items:center}

  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--surface);
    border-top:1px solid var(--line); display:flex; padding-bottom:var(--safe-b);
  }
  nav.tabs button{flex:1; background:transparent; border-radius:0; padding:9px 2px 8px;
    display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted); font-size:11px}
  nav.tabs button .ic{font-size:21px; line-height:1}
  nav.tabs button.on{color:var(--brand)}

  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; display:none; align-items:flex-end; justify-content:center}
  .modal-bg.open{display:flex}
  .modal{background:var(--surface); width:100%; max-width:720px; max-height:92vh; overflow:auto;
    border-radius:20px 20px 0 0; padding:18px 16px calc(24px + var(--safe-b))}
  .modal h3{margin:4px 0 2px; font-size:19px}
  .modal .modal-head{display:flex; align-items:center; margin-bottom:6px}
  .modal .modal-head button{margin-left:auto}
  @media(min-width:721px){ .modal{border-radius:20px; margin-bottom:5vh} .modal-bg{align-items:center} }

  .empty{text-align:center; color:var(--muted); padding:40px 20px}
  .empty .big{font-size:42px; margin-bottom:8px}
  .bar{height:8px; background:var(--surface-2); border-radius:999px; overflow:hidden; margin-top:6px}
  .bar>i{display:block; height:100%; background:var(--brand)}
  .stat{display:flex; gap:14px; flex-wrap:wrap}
  .stat .k{font-size:26px; font-weight:750}
  .stat .l{font-size:12px; color:var(--muted)}
  .measure-val{font-variant-numeric:tabular-nums; font-weight:700}
  .hint{font-size:12.5px; color:var(--muted); background:var(--surface-2); border-radius:10px; padding:10px 12px; margin-top:10px}
  .notice{font-size:12.5px; border-left:3px solid var(--warn); padding:8px 12px; background:rgba(199,121,26,.08); border-radius:0 8px 8px 0; margin:8px 0}
  hr.sep{border:none; border-top:1px solid var(--line); margin:14px 0}
  .link{color:var(--accent); background:none; padding:0; font-size:14px}

  /* Einstellungen ("Mehr"): Zeilen mit Schalter und Erklärung */
  h2.section.group{margin-top:22px}
  .set{display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-top:1px solid var(--line)}
  .set:first-of-type{border-top:none; padding-top:2px}
  .set .txt{flex:1 1 auto; min-width:0}
  .set .name{font-weight:650; font-size:15.5px}
  .set .desc{font-size:13px; color:var(--muted); margin-top:3px}
  .set .desc b{color:var(--text); font-weight:600}
  .sw{position:relative; flex:0 0 auto; width:48px; height:28px; margin-top:2px}
  .sw input{opacity:0; width:0; height:0; position:absolute}
  .sw span{position:absolute; inset:0; border-radius:999px; background:var(--line); transition:background .15s}
  .sw span::after{content:""; position:absolute; left:3px; top:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .15s}
  .sw input:checked + span{background:var(--brand)}
  .sw input:checked + span::after{transform:translateX(20px)}
  .sw input:focus-visible + span{outline:2px solid var(--accent); outline-offset:2px}
  .sub-set{margin:4px 0 2px; padding:10px 12px; background:var(--surface-2); border-radius:12px}
  .sub-set label{margin-top:0}
  .example{font-size:12.5px; color:var(--muted); margin-top:8px}
  details.more-info summary{cursor:pointer; color:var(--accent); font-size:14px; margin-top:8px; list-style:none}
  details.more-info summary::-webkit-details-marker{display:none}
  .status-line{display:flex; align-items:center; gap:10px; margin-top:8px; font-size:14.5px}
  .center{text-align:center}
/* Art-Auswahl beim Anlegen */
.kind-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.kind-tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);cursor:pointer}
.kind-tile:active{transform:scale(.98)}
.kind-tile .ic{font-size:26px;line-height:1}
.kind-tile .nm{font-weight:600;font-size:15px}
.kind-tile .ex{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fb094"/><stop offset="1" stop-color="#1f8a70"/></linearGradient></defs><rect x="3" y="3" width="42" height="42" rx="12" fill="url(#g)"/><path d="M16 24h16M24 16v16" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg>
  <h1>Dosia</h1>
  <div class="date" id="headerDate"></div>
</header>

<main id="view"></main>

<button class="fab" id="fab" title="Hinzufügen">+</button>

<nav class="tabs" id="tabs">
  <button data-tab="today" class="on"><span class="ic">📅</span>Heute</button>
  <button data-tab="meds"><span class="ic">💊</span>Mittel</button>
  <button data-tab="measure"><span class="ic">📈</span>Werte</button>
  <button data-tab="history"><span class="ic">✓</span>Verlauf</button>
  <button data-tab="more"><span class="ic">⋯</span>Mehr</button>
</nav>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script src="i18n.js"></script>
<script src="version.js"></script>
<script src="gdrive.js"></script>
<script src="update.js"></script>
<script src="app.js"></script>
</body>
</html>
