name: Android Release (AAB + APK)

# Baut ein signiertes App Bundle (.aab) für Google Play und ein signiertes .apk für die Homepage
# und lädt APK + CHANGELOG automatisch auf die Homepage hoch (wenn Zugangsdaten hinterlegt sind).
#
# GitHub-Secrets (Repo -> Settings -> Secrets and variables -> Actions):
#   Signatur (Pflicht):
#     DOSIA_KEYSTORE_BASE64  = Base64 des Upload-Keystores
#     DOSIA_STORE_PASSWORD   = Store-Passwort
#     DOSIA_KEY_PASSWORD     = Key-Passwort
#     DOSIA_KEY_ALIAS        = Alias des Schlüssels
#   Homepage-Upload (optional – fehlen sie, wird der Upload übersprungen):
#     DOSIA_DEPLOY_URL       = sftp://host[:port]   oder   ftp://host  (FTP wird nur verschlüsselt per TLS genutzt)
#     DOSIA_DEPLOY_USER      = Benutzername
#     DOSIA_DEPLOY_PASSWORD  = Passwort
#     DOSIA_DEPLOY_PATH      = Ordner der Homepage auf dem Server (dort liegen index.php und version.php), z. B. /  oder  /httpdocs/dosia

on:
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: 'APK und CHANGELOG auf die Homepage hochladen (installierte Apps bieten dann das Update an)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Standard wäre 'tools' – das Paket gibt es nicht mehr
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Read version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Dosia $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Sync web assets into Android project
        run: npm run sync

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.DOSIA_KEYSTORE_BASE64 }}
        run: |
          # Leerzeichen/Zeilenumbrüche tolerieren
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/dosia-upload.keystore"
          ls -l "$RUNNER_TEMP/dosia-upload.keystore"

      - name: Build signed AAB and APK
        working-directory: android
        env:
          DOSIA_STORE_FILE: ${{ runner.temp }}/dosia-upload.keystore
          DOSIA_STORE_PASSWORD: ${{ secrets.DOSIA_STORE_PASSWORD }}
          DOSIA_KEY_ALIAS: ${{ secrets.DOSIA_KEY_ALIAS }}
          DOSIA_KEY_PASSWORD: ${{ secrets.DOSIA_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          # AAB = Play-Variante (ohne Selbst-Update), APK = Homepage-Variante (mit Selbst-Update)
          ./gradlew bundlePlayRelease assembleDirectRelease --no-daemon

      - name: Rename outputs with version
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p out
          cp android/app/build/outputs/bundle/playRelease/*.aab   "out/Dosia-$V.aab"
          cp android/app/build/outputs/apk/direct/release/*.apk  "out/Dosia-$V.apk"
          ls -l out

      - name: Upload AAB (fuer den Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: Dosia-${{ steps.ver.outputs.version }}-aab
          path: out/Dosia-${{ steps.ver.outputs.version }}.aab

      - name: Upload APK (zum Sideload-Testen)
        uses: actions/upload-artifact@v4
        with:
          name: Dosia-${{ steps.ver.outputs.version }}-apk
          path: out/Dosia-${{ steps.ver.outputs.version }}.apk

      # ---------- Homepage ----------
      - name: Auf die Homepage hochladen
        id: deploy
        if: ${{ github.event_name == 'push' || inputs.veroeffentlichen }}
        env:
          DEPLOY_URL: ${{ secrets.DOSIA_DEPLOY_URL }}
          DEPLOY_USER: ${{ secrets.DOSIA_DEPLOY_USER }}
          LFTP_PASSWORD: ${{ secrets.DOSIA_DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DOSIA_DEPLOY_PATH }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          if [ -z "$DEPLOY_URL" ] || [ -z "$DEPLOY_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "Keine Homepage-Zugangsdaten hinterlegt – Upload übersprungen."
            echo "Homepage-Upload: übersprungen (keine Zugangsdaten)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$DEPLOY_URL" in sftp://*|ftp://*) ;; *) echo "::error::DOSIA_DEPLOY_URL muss mit sftp:// oder ftp:// beginnen"; exit 1;; esac
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null
          # Erst unter Zwischennamen hochladen, dann umbenennen: die Homepage liefert nie eine halbe Datei aus.
          lftp --env-password -u "$DEPLOY_USER" "$DEPLOY_URL" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 3
          set net:timeout 30
          set sftp:auto-confirm yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          cd "${DEPLOY_PATH:-/}"
          mkdir -p -f download
          put out/Dosia-$V.apk -o download/.upload-Dosia-$V.apk
          rm -f download/Dosia-$V.apk
          mv download/.upload-Dosia-$V.apk download/Dosia-$V.apk
          put CHANGELOG.md -o .upload-CHANGELOG.md
          rm -f CHANGELOG.md
          mv .upload-CHANGELOG.md CHANGELOG.md
          ls -l download
          bye
          EOF
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Homepage prüfen
        if: ${{ steps.deploy.outputs.uploaded == 'true' }}
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          URL=$(node -p "require('./package.json').dosia.updateUrl")
          LOCAL_SHA=$(sha256sum "out/Dosia-$V.apk" | cut -d' ' -f1)
          sleep 3
          J=$(curl -fsS "$URL?v=$V&t=$(date +%s)")
          REMOTE_V=$(echo "$J" | jq -r .version)
          REMOTE_SHA=$(echo "$J" | jq -r .sha256)
          echo "Homepage meldet Version $REMOTE_V"
          if [ "$REMOTE_V" = "$V" ] && [ "$REMOTE_SHA" = "$LOCAL_SHA" ]; then
            echo "Homepage-Upload: ✅ Version $V ist online, Prüfsumme stimmt – installierte Apps bieten das Update an." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$(printf '%s\n%s\n' "$V" "$REMOTE_V" | sort -V | tail -1)" = "$REMOTE_V" ] && [ "$REMOTE_V" != "$V" ]; then
            echo "::warning::Auf der Homepage liegt bereits eine neuere Version ($REMOTE_V); $V wurde hochgeladen, wird aber nicht angeboten."
            echo "Homepage-Upload: ⚠️ hochgeladen, aber neuere Version $REMOTE_V ist schon online" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Homepage meldet Version $REMOTE_V / Prüfsumme ${REMOTE_SHA:0:12}… – erwartet $V / ${LOCAL_SHA:0:12}…"
            exit 1
          fi
