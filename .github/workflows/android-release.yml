name: Android Release (AAB + APK)

# Baut ein signiertes App Bundle (.aab) fuer den Play Store und ein signiertes .apk.
# Laeuft auf Linux -> umgeht die AF_UNIX-/Proxy-Probleme der lokalen Umgebung.
#
# Benoetigte GitHub-Secrets (Repo -> Settings -> Secrets and variables -> Actions):
#   DOSIA_KEYSTORE_BASE64  = Base64 des Upload-Keystores (Inhalt von KEYSTORE-BASE64.txt)
#   DOSIA_STORE_PASSWORD   = Store-Passwort (siehe KEYSTORE-PASSWORT.txt)
#   DOSIA_KEY_PASSWORD     = Key-Passwort (identisch zum Store-Passwort)
#   DOSIA_KEY_ALIAS        = dosia

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Standard waere 'tools' – das Paket gibt es nicht mehr
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.DOSIA_KEYSTORE_BASE64 }}
        run: |
          # Leerzeichen/Zeilenumbrueche tolerieren
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/dosia-upload.keystore"
          ls -l "$RUNNER_TEMP/dosia-upload.keystore"

      - name: Build signed AAB and APK
        working-directory: android
        env:
          DOSIA_STORE_FILE: ${{ runner.temp }}/dosia-upload.keystore
          DOSIA_STORE_PASSWORD: ${{ secrets.DOSIA_STORE_PASSWORD }}
          DOSIA_KEY_ALIAS: ${{ secrets.DOSIA_KEY_ALIAS }}
          DOSIA_KEY_PASSWORD: ${{ secrets.DOSIA_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload AAB (fuer den Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: dosia-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK (zum Sideload-Testen)
        uses: actions/upload-artifact@v4
        with:
          name: dosia-release-apk
          path: android/app/build/outputs/apk/release/*.apk
